<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Flow</title>
<style>
  body { margin: 0; font: 13px sans-serif; background: #fafafa; }
  #msg { padding: 6px 12px; color: #b00; white-space: pre-wrap; min-height: 1em; }
  .lane { fill: none; stroke: #ddd; }
  .lane-label { fill: #999; font-size: 12px; text-transform: uppercase; }
  .node rect { fill: #fff; stroke: #333; }
  .node.decision rect { stroke-dasharray: 5 3; }
  .node.start rect, .node.end rect { fill: #eee; }
  .node.end rect { stroke-width: 2.5; }
  .node text { text-anchor: middle; }
  .node .type { fill: #999; font-size: 10px; }
  .edge { fill: none; stroke: #555; marker-end: url(#arrow); }
  .lbl { fill: #333; font-size: 11px; text-anchor: middle; paint-order: stroke; stroke: #fafafa; stroke-width: 4px; }
  .lbl .extra { fill: #888; }
  .data { fill: #1a5fb4; font-family: monospace; font-size: 11px; }
  .node .io { fill: #1a5fb4; font-family: monospace; font-size: 10px; text-anchor: start; }
</style>
</head>
<body>
<div id="msg"></div>
<svg id="svg"></svg>
<script>
const W = 200, COL = W + 150, BASE_H = 46, GAP = 16, PAD = 30, LANE_LBL = 90, CHARS = 28;
let H = BASE_H;

// "in: a, b, c" wrapped to CHARS per line, continuation lines indented
function ioLines(n) {
  const out = [];
  for (const [k, items] of [['in', n.inputs], ['out', n.outputs]]) {
    if (!items) continue;
    let line = k + ':';
    for (const it of items) {
      if (line.length + it.length + 2 > CHARS && line !== k + ':') { out.push(line + ','); line = '    '; }
      line += ' ' + it;
    }
    out.push(line);
  }
  return out;
}

function render(flow) {
  const nodes = flow.nodes || [], edges = flow.edges || [];
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const missing = [...new Set(edges.flatMap(e => [e.from, e.to]).filter(id => !byId[id]))];
  H = BASE_H + 13 * Math.max(0, ...nodes.map(n => ioLines(n).length));

  // depth = BFS distance from roots (nodes without incoming edges)
  const hasIn = new Set(edges.filter(e => e.from !== e.to && byId[e.from]).map(e => e.to));
  const depth = {};
  let queue = nodes.filter(n => !hasIn.has(n.id)).map(n => n.id);
  if (!queue.length && nodes.length) queue = [nodes[0].id];
  queue.forEach(id => depth[id] = 0);
  while (queue.length) {
    const id = queue.shift();
    for (const e of edges) if (e.from === id && byId[e.to] && !(e.to in depth)) { depth[e.to] = depth[id] + 1; queue.push(e.to); }
  }
  nodes.forEach(n => { if (!(n.id in depth)) depth[n.id] = 0; });

  // lanes = actors; stack nodes that share (actor, depth)
  const actors = flow.actors || [...new Set(nodes.map(n => n.actor || '?'))];
  nodes.forEach(n => { if (!actors.includes(n.actor || '?')) actors.push(n.actor || '?'); });
  const slot = {}, count = {};
  nodes.forEach(n => { const k = (n.actor || '?') + '|' + depth[n.id]; slot[n.id] = count[k] = (count[k] || 0); count[k]++; });
  const rows = Object.fromEntries(actors.map(a => [a, 1]));
  for (const k in count) { const a = k.split('|')[0]; rows[a] = Math.max(rows[a], count[k]); }
  const laneTop = {}; let y = PAD;
  actors.forEach(a => { laneTop[a] = y; y += rows[a] * (H + GAP) + GAP; });
  const maxDepth = Math.max(0, ...Object.values(depth));
  const totalW = PAD + LANE_LBL + (maxDepth + 1) * COL + 60, totalH = y + PAD;

  const pos = {};
  nodes.forEach(n => {
    pos[n.id] = { x: PAD + LANE_LBL + depth[n.id] * COL, y: laneTop[n.actor || '?'] + GAP + slot[n.id] * (H + GAP) };
  });

  let s = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>`;
  actors.forEach(a => {
    s += `<rect class="lane" x="${PAD / 2}" y="${laneTop[a]}" width="${totalW - PAD}" height="${rows[a] * (H + GAP) + GAP}"/>`;
    s += `<text class="lane-label" x="${PAD}" y="${laneTop[a] + 16}">${a}</text>`;
  });

  let labels = '';
  edges.forEach(e => {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return;
    let d, mx, my, anchor = 'middle';
    if (e.from === e.to) {
      const cx = a.x + W / 2, y = a.y + H;
      d = `M${cx - 14},${y} C${cx - 50},${y + 40} ${cx + 50},${y + 40} ${cx + 14},${y}`;
      mx = cx; my = y + 24;
    } else if (depth[e.to] > depth[e.from]) {
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, c = (x2 - x1) / 2;
      d = `M${x1},${y1} C${x1 + c},${y1} ${x2 - c},${y2} ${x2},${y2}`;
      mx = (x1 + x2) / 2; my = (y1 + y2) / 2;
    } else if (depth[e.to] === depth[e.from]) {
      const down = b.y > a.y, x1 = a.x + W / 2, y1 = down ? a.y + H : a.y, x2 = b.x + W / 2, y2 = down ? b.y : b.y + H;
      d = `M${x1},${y1} L${x2},${y2}`;
      mx = (x1 + x2) / 2; my = (y1 + y2) / 2;
    } else {
      const x1 = a.x + W / 2, y1 = a.y + H, x2 = b.x + W / 2, y2 = b.y + H, bow = 70;
      d = `M${x1},${y1} C${x1},${y1 + bow} ${x2},${y2 + bow} ${x2},${y2}`;
      mx = x1 - 8; my = y1 + 22; anchor = 'end'; // label near the source, left of the descending curve
    }
    s += `<path class="edge" d="${d}"/>`;
    const extra = [e.guard ? `[${e.guard}]` : '', e.action ? `/ ${e.action}` : ''].filter(Boolean).join(' ');
    labels += `<text class="lbl" x="${mx}" y="${my}" text-anchor="${anchor}"><tspan x="${mx}">${e.event || ''}</tspan>`
       + (extra ? `<tspan class="extra" x="${mx}" dy="12">${extra}</tspan>` : '')
       + (e.data ? `<tspan class="data" x="${mx}" dy="12">{${e.data.join(', ')}}</tspan>` : '')
       + `</text>`;
  });

  nodes.forEach(n => {
    const p = pos[n.id];
    s += `<g class="node ${n.type || ''}" transform="translate(${p.x},${p.y})">
      <rect width="${W}" height="${H}" rx="8"/>
      <text x="${W / 2}" y="${BASE_H / 2 + 1}">${n.label || n.id}</text>
      <text class="type" x="${W / 2}" y="${BASE_H - 6}">${n.type || ''}${n.timeout ? ' · timeout' : ''}</text>
      ${ioLines(n).map((l, i) => `<text class="io" x="8" y="${BASE_H + 6 + 13 * i}" xml:space="preserve">${l}</text>`).join('')}
    </g>`;
  });
  s += labels;

  const svg = document.getElementById('svg');
  svg.setAttribute('width', totalW); svg.setAttribute('height', totalH);
  svg.innerHTML = s;
  document.getElementById('msg').textContent = missing.length ? 'Edges reference unknown nodes: ' + missing.join(', ') : '';
}

// hot reload: poll the file, re-render when its text changes
let last = '';
async function poll() {
  try {
    const t = await (await fetch('flow.json', { cache: 'no-store' })).text();
    if (t !== last) { last = t; render(JSON.parse(t)); }
  } catch (err) {
    document.getElementById('msg').textContent = err.message;
  }
}
poll(); setInterval(poll, 500);
</script>
</body>
</html>
